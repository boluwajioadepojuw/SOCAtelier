title: Registry Run Key Write for Persistence
id: d16a0c08-4a5e-4db9-bd0d-4fa58eb29f73
status: test
description: Detects writes to common registry run key locations used for persistence. Observed in Lynx stress test (T1547.001) and IR-006 scenario. Sysmon EID 13 captures registry value set events on these paths.
references:
    - https://attack.mitre.org/techniques/T1547/001/
    - https://github.com/Adepoju/SOCAtelier
author: Boluwaji Oluwaseyi Adepoju
date: 2026-06-10
tags:
    - attack.persistence
    - attack.t1547.001
logsource:
    category: registry_set
    product: windows
detection:
    selection:
        TargetObject|contains:
            - '\Software\Microsoft\Windows\CurrentVersion\Run'
            - '\Software\Microsoft\Windows\CurrentVersion\RunOnce'
            - '\Software\Microsoft\Windows NT\CurrentVersion\Winlogon'
            - '\SYSTEM\CurrentControlSet\Services'
    filter_legitimate:
        Image|contains:
            - '\MsiExec.exe'
            - '\msiexec.exe'
    condition: selection and not filter_legitimate
falsepositives:
    - Software installation via MSI packages
    - Legitimate startup program configuration by admin
level: high
fields:
    - TargetObject
    - Details
    - Image
    - User
