title: Process Spawned from Unusual Directory
author: Boluwaji Oluwaseyi Adepoju
id: 2b41c23f-7c3a-40d4-aa78-874060e13e68
status: experimental
description: Portable version of the matching lab detection, converted from the Elastic rule shipped in SOCAtelier.
references:
    - https://attack.mitre.org/techniques/T1036/
date: 2026/10/11
tags:
    - attack.defense_evasion
    - attack.t1036
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|contains:
            - '\Temp\'
            - '\ProgramData\'
            - '\AppData\Roaming\'
            - '\AppData\Local\Temp\'
    condition: selection
falsepositives:
    - Portable applications and self-updating installers
level: low
