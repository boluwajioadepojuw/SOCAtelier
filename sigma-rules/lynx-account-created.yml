title: Local Account Created by Shell
id: 587eab05-a930-4fc7-a4a2-c819c2bb20a5
status: experimental
description: Detects net.exe adding a local user from a shell, a move seen in both persistence and lateral movement playbooks.
references:
    - https://attack.mitre.org/techniques/T1136/001/
author: Boluwaji Oluwaseyi Adepoju
date: 2026/06/10
tags:
    - attack.persistence
    - attack.t1136.001
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\\net.exe'
        CommandLine|contains: 'user'
        CommandLine|contains: '/add'
    condition: selection
falsepositives:
    - Account provisioning scripts in managed environments
level: medium
