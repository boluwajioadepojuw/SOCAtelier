title: File Timestamp Manipulation
id: ea20ec16-bca9-46fd-bb35-0ea5086e90ad
status: experimental
description: Detects timestomp attempts on a dropped file, hiding when it was created.
references:
    - https://attack.mitre.org/techniques/T1070/006/
author: Boluwaji Oluwaseyi Adepoju
date: 2026/06/10
tags:
    - attack.defense_evasion
    - attack.t1070.006
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\\powershell.exe'
        CommandLine|contains: 'CreationTime'
        CommandLine|contains: '.CopyTo'
    condition: selection
falsepositives:
    - Rare legitimate copy-and-date workflows
level: low
