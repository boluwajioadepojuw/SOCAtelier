# osTicket — alert-to-ticket pipeline for Lynx.
#
# The Lynx osticket_bridge module POSTs OPEN cases to this instance's HTTP
# API; analysts work tickets in the osTicket UI and the close status lives
# on the Lynx case document.
#
#   docker compose -f docker/osticket/docker-compose.yml up -d
#   -> web:    http://localhost:8080  (first-run installer)
#   -> api:    http://localhost:8080/api/http.php/tickets.json

services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${OSTICKET_DB_PASSWORD:-osticket_root}
      MYSQL_DATABASE: osticket
      MYSQL_USER: osticket
      MYSQL_PASSWORD: ${OSTICKET_DB_PASSWORD:-osticket}
    volumes:
      - osticket_db:/var/lib/mysql

  osticket:
    image: campbellsoftwaresolutions/osticket:latest
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8080:80"
    environment:
      DB_HOST: db
      DB_NAME: osticket
      DB_USER: osticket
      DB_PASSWORD: ${OSTICKET_DB_PASSWORD:-osticket}
    volumes:
      - osticket_files:/var/www/html

volumes:
  osticket_db:
  osticket_files:
